$kind: http-request
url: "{{baseUrl}}/empleados?dni=12345678Z&turnoNoche=false&salarioMin=1500"
method: GET
queryParams:
  dni: 12345678Z
  turnoNoche: "false"
  salarioMin: "1500"
scripts:
  - type: afterResponse
    code: pm.test('Status 200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
