$kind: http-request
url: "{{baseUrl}}/empleados"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dni": "87654321X",
      "nombreCompleto": "Carlos Ruiz",
      "fechaContratacion": "2026-11-11",
      "salario": 1750.00,
      "turnoNoche": true
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
