$kind: http-request
url: "{{baseUrl}}/empleados/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "dni": "12345678Z",
      "nombreCompleto": "Laura Gomez",
      "fechaContratacion": "2024-03-15",
      "salario": 1950.00,
      "turnoNoche": false
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
