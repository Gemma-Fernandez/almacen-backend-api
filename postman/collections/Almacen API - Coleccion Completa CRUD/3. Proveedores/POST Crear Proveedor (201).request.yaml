$kind: http-request
url: "{{baseUrl}}/proveedores"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "cif": "A87654321",
      "nombreEmpresa": "Deportes Iberica SA",
      "telefono": "600333444",
      "activo": true,
      "valoracion": 4.5
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 201 Created', () => pm.response.to.have.status(201));
    language: text/javascript
order: 2000
