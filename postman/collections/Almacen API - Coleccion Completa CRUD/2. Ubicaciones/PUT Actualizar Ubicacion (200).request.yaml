$kind: http-request
url: "{{baseUrl}}/ubicaciones/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigoUbicacion": "PAS-A-EST-01",
      "pasillo": "A",
      "capacidadMax": 600,
      "ocupada": true,
      "fechaUltimaRevision": "2026-11-11"
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
