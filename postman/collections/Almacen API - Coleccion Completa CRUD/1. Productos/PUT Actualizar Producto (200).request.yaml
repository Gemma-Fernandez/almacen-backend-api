$kind: http-request
url: "{{baseUrl}}/productos/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigoSKU": "PROD-12345",
      "nombre": "Mancuerna Maniak 20kg (Actualizada)",
      "precio": 24.99,
      "stock": 180,
      "fechaAlta": "2026-11-11",
      "ubicacionId": 3,
      "proveedorId": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
