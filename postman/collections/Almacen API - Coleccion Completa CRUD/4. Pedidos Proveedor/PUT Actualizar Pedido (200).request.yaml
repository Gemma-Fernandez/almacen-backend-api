$kind: http-request
url: "{{baseUrl}}/pedidos/1"
method: PUT
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "numeroAlbaran": "ALB-2026-001",
      "fechaEntregaPrevista": "2026-11-20",
      "costeTotal": 1250.50,
      "recibido": true,
      "proveedorId": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status 200 OK', () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
