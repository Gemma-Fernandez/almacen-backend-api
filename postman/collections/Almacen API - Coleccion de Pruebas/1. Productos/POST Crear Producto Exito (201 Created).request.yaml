$kind: http-request
url: "{{baseUrl}}/productos"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "codigoSKU": "PROD-99999",
      "nombre": "Mancuerna Maniak 15kg",
      "precio": 19.99,
      "stock": 200,
      "fechaAlta": "2026-11-11",
      "ubicacionId": 3,
      "proveedorId": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code es 201 Created', function () {
          pm.response.to.have.status(201);
      });
    language: text/javascript
order: 2000
