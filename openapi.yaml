openapi: 3.0.3
info:
  title: API REST - Sistema de Gestión de Almacén y Logística
  description: Especificación OpenAPI 3.0 para la gestión de productos, ubicaciones, proveedores, pedidos y empleados.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor Local / WireMock

paths:

  # =====================================
  # 1. ENTIDAD: PRODUCTOS

  /productos:
    get:
      summary: Listar productos con filtros
      operationId: getProductos
      parameters:
        - name: codigoSKU
          in: query
          description: Filtrar por SKU parcial o exacto
          required: false
          schema:
            type: string
        - name: stockMin
          in: query
          description: Filtrar por stock mínimo
          required: false
          schema:
            type: integer
        - name: precioMax
          in: query
          description: Filtrar por precio máximo
          required: false
          schema:
            type: number
            format: float
      responses:
        '200':
          description: Lista de productos obtenida con éxito
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
    post:
      summary: Crear nuevo producto
      operationId: createProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        '201':
          description: Producto creado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '500':
          $ref: '#/components/responses/500InternalError'
  /productos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Obtener un producto por ID
      operationId: getProductoById
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
    put:
      summary: Actualizar un producto existente
      operationId: updateProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        '200':
          description: Producto actualizado correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
    delete:
      summary: Eliminar un producto
      operationId: deleteProducto
      responses:
        '204':
          description: Producto eliminado exitosamente
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'

    # ===========================================
    # 2. ENTIDAD: UBICACIONES

    /ubicaciones:
      get:
        summary: Listar ubicaciones con filtros
        operationId: getUbicaciones
        parameters:
          - name: codigoUbicacion
            in: query
            required: false
            schema:
              type: string
          - name: pasillo
            in: query
            required: false
            schema:
              type: integer
          - name: ocupada
            in: query
            required: false
            schema:
              type: boolean
        responses:
          '200':
            description: Lista de ubicaciones obtenida con éxito
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Ubicacion'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'
      post:
        summary: Crear ubicación
        operationId: createUbicacion
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionInput'
        responses:
          '201':
            description: Ubicación creada
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Ubicacion'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'

    /ubicaciones/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      get:
        summary: Obtener ubicación por ID
        operationId: getUbicacionById
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Ubicacion'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      put:
        summary: Actualizar ubicación
        operationId: updateUbicacion
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UbicacionInput'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Ubicacion'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      delete:
        summary: Eliminar ubicación
        operationId: deleteUbicacion
        responses:
          '204':
            description: Eliminada correctamente
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'

    # ==============================================
    # 3. ENTIDAD: PROVEEDORES

    /proveedores:
      get:
        summary: Listar proveedores con filtros
        operationId: getProveedores
        parameters:
          - name: cif
            in: query
            required: false
            schema:
              type: string
          - name: nombreEmpresa
            in: query
            required: false
            schema:
              type: string
          - name: activo
            in: query
            required: false
            schema:
              type: boolean
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Proveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'
      post:
        summary: Crear proveedor
        operationId: createProveedor
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorInput'
        responses:
          '201':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Proveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'

    /proveedores/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      get:
        summary: Obtener proveedor por ID
        operationId: getProveedorById
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Proveedor'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      put:
        summary: Actualizar proveedor
        operationId: updateProveedor
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProveedorInput'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Proveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      delete:
        summary: Eliminar proveedor
        operationId: deleteProveedor
        responses:
          '204':
            description: Eliminado
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'

    # ===================================
    # 4. ENTIDAD: PEDIDOS DE PROVEEDOR

    /pedidos-proveedor:
      get:
        summary: Listar pedidos a proveedores con filtros
        operationId: getPedidosProveedor
        parameters:
          - name: numeroAlbaran
            in: query
            required: false
            schema:
              type: string
          - name: recibido
            in: query
            required: false
            schema:
              type: boolean
          - name: proveedorId
            in: query
            required: false
            schema:
              type: integer
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/PedidoProveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'
      post:
        summary: Crear nuevo pedido
        operationId: createPedidoProveedor
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoProveedorInput'
        responses:
          '201':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PedidoProveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'

    /pedidos-proveedor/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      get:
        summary: Obtener pedido por ID
        operationId: getPedidoProveedorById
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PedidoProveedor'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      put:
        summary: Actualizar pedido
        operationId: updatePedidoProveedor
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoProveedorInput'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/PedidoProveedor'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      delete:
        summary: Eliminar pedido
        operationId: deletePedidoProveedor
        responses:
          '204':
            description: Eliminado
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'

    # =====================================
    # 5. ENTIDAD: EMPLEADOS

    /empleados:
      get:
        summary: Listar empleados con filtros
        operationId: getEmpleados
        parameters:
          - name: dni
            in: query
            required: false
            schema:
              type: string
          - name: turnoNoche
            in: query
            required: false
            schema:
              type: boolean
          - name: salarioMin
            in: query
            required: false
            schema:
              type: number
              format: float
        responses:
          '200':
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Empleado'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'
      post:
        summary: Crear empleado
        operationId: createEmpleado
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoInput'
        responses:
          '201':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Empleado'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '500':
            $ref: '#/components/responses/500InternalError'

    /empleados/{id}:
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      get:
        summary: Obtener empleado por ID
        operationId: getEmpleadoById
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Empleado'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      put:
        summary: Actualizar empleado
        operationId: updateEmpleado
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmpleadoInput'
        responses:
          '200':
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Empleado'
          '400':
            $ref: '#/components/responses/400BadRequest'
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'
      delete:
        summary: Eliminar empleado
        operationId: deleteEmpleado
        responses:
          '204':
            description: Eliminado
          '404':
            $ref: '#/components/responses/404NotFound'
          '500':
            $ref: '#/components/responses/500InternalError'

  # ==========================================
  # COMPONENTES Y ESQUEMAS (MODELOS DE DATOS)

components:
  schemas:
    ProductoInput:
      type: object
      required:
        - codigoSKU
        - nombre
        - fechaAlta
      properties:
        codigoSKU:
          type: string
          pattern: '^PROD-[0-9]{5}$'
          example: "PROD-12345"
        nombre:
          type: string
          example: "Zapatillas Running Trail"
        precio:
          type: number
          format: float
          minimum: 0.01
          example: 89.99
        stock:
          type: integer
          minimum: 0
          example: 150
        fechaAlta:
          type: string
          format: date
          example: "2026-11-11"
        ubicacionId:
          type: integer
          example: 1
        proveedorId:
          type: integer
          example: 2

    Producto:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 101
        - $ref: '#/components/schemas/ProductoInput'

    UbicacionInput:
      type: object
      required:
        - codigoUbicacion
        - ocupada
      properties:
        codigoUbicacion:
          type: string
          pattern: '^PAS-[0-9]{2}-[A-Z]$'
          example: "PAS-04-B"
        pasillo:
          type: integer
          minimum: 1
          maximum: 50
          example: 4
        altura:
          type: number
          format: float
          example: 2.50
        ocupada:
          type: boolean
          example: true
        fechaUltimaRevision:
          type: string
          format: date
          example: "2026-11-01"

    Ubicacion:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 1
        - $ref: '#/components/schemas/UbicacionInput'

    ProveedorInput:
      type: object
      required:
        - cif
        - nombreEmpresa
      properties:
        cif:
          type: string
          pattern: '^[A-Z][0-9]{8}$'
          example: "B12345678"
        nombreEmpresa:
          type: string
          example: "Logística Global S.L."
        telefono:
          type: integer
          example: 912345678
        evaluacionCalidad:
          type: number
          format: float
          minimum: 0.0
          maximum: 5.0
          example: 4.8
        activo:
          type: boolean
          example: true

    Proveedor:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 2
        - $ref: '#/components/schemas/ProveedorInput'

    PedidoProveedorInput:
      type: object
      required:
        - numeroAlbaran
        - fechaEntregaPrevista
        - cantidadUnidades
      properties:
        numeroAlbaran:
          type: string
          pattern: '^ALB-[0-9]{4}-[0-9]{3}$'
          example: "ALB-2026-001"
        cantidadUnidades:
          type: integer
          minimum: 1
          example: 500
        costeTotal:
          type: number
          format: float
          example: 12500.50
        recibido:
          type: boolean
          example: false
        fechaEntregaPrevista:
          type: string
          format: date
          example: "2026-11-20"
        proveedorId:
          type: integer
          example: 2
        empleadoId:
          type: integer
          example: 5

    PedidoProveedor:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 50
        - $ref: '#/components/schemas/PedidoProveedorInput'

    EmpleadoInput:
      type: object
      required:
        - dni
        - nombreCompleto
      properties:
        dni:
          type: string
          pattern: '^[0-9]{8}[A-Z]$'
          example: "12345678Z"
        nombreCompleto:
          type: string
          example: "Carlos Gómez Pérez"
        turnoNoche:
          type: boolean
          example: false
        salarioBase:
          type: number
          format: float
          minimum: 1080.00
          example: 1450.00
        fechaContratacion:
          type: string
          format: date
          example: "2024-03-15"

    Empleado:
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              type: integer
              example: 5
        - $ref: '#/components/schemas/EmpleadoInput'

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date
          example: "2026-11-11"
        status:
          type: integer
          example: 400
        error:
          type: string
          example: "Bad Request"
        mensaje:
          type: string
          example: "Error de validación en la solicitud."

  responses:
    400BadRequest:
      description: Solicitud incorrecta o error de validación en los datos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    500InternalError:
      description: Error interno del servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'